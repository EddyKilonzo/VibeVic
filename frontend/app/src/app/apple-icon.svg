<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Victor Kiplimo">
  <!--
    The home-screen icon. The same mark, redrawn at size rather than scaled.

    iOS renders this at 180px and applies its own rounding, so the tile is
    square: a rounded rect under a rounded mask leaves a pale seam at the
    corners.

    At this size the cell can carry the ring the 16px version has to drop — the
    full hexagon behind the V, which is the honeycomb the site is textured
    with. That is the whole reason this file differs from `icon.svg`: the mark
    is one shape at both sizes, and only how much of it survives changes.
  -->
  <rect width="180" height="180" fill="#0E47A1"/>
  <g fill="none" stroke-linejoin="round">
    <path
      d="M90 22 L149 56 L149 124 L90 158 L31 124 L31 56 Z"
      stroke="#ffffff"
      stroke-opacity="0.22"
      stroke-width="9"
    />
    <path
      d="M31 56 L31 124 L90 158 L149 124 L149 56"
      stroke="#ffffff"
      stroke-width="17"
      stroke-linecap="round"
    />
  </g>
</svg>
