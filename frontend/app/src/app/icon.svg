<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Victor Kiplimo">
  <!--
    The site's mark at tab size — the same shape as `components/Logotype.tsx`,
    redrawn here rather than imported.

    It has to be a standalone file: Next resolves this by convention and a
    browser fetches it on its own, so it cannot be a React component. The
    geometry is therefore duplicated, and the duplication is deliberate rather
    than accidental — the alternative is a build step that generates one file
    from the other, which is more machinery than four coordinates deserve.

    ── What differs from the component, and why ──────────────────────────
    No ring. In the component the full hexagon sits behind the V at a quarter
    opacity; at 16 CSS pixels those two strokes are three pixels apart and the
    eye resolves them as one thick smudge. The V alone is still the mark, and
    `LogoMark` has a `bare` prop that draws exactly this.

    The V is also heavier here — 3.4 against 3 — because a stroke on a white
    tile in a tab strip is doing without the surrounding contrast the header
    gives it.

    Drawn as geometry, never as <text>: a favicon containing a text element
    renders in whatever font the browser resolves, which is not the site's, and
    a monogram that falls back to Times on one machine is not a mark.
  -->
  <rect width="32" height="32" rx="7" fill="#0E47A1"/>
  <path
    d="M8.6 11 L8.6 21.2 L16 25.4 L23.4 21.2 L23.4 11"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
